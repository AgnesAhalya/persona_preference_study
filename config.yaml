experimental_models:
  - MODEL_1
  - MODEL_2

experiment_id: five_personas_plus_assistant_v3

judge_models:
  - JUDGE_1
  - JUDGE_2

prompt_files:
  personas: prompts/personas.yaml
  experiment: prompts/experiment.yaml
  judges: prompts/judges.yaml

include_baseline: true
baseline:
  id: P0
  name: Assistant

personas:
  P1:
    name: Mathematician
  P2:
    name: Strategist
  P3:
    name: Contrarian
  P4:
    name: Slacker
  P5:
    name: Adversarial

judge_personas:
  - P1
  - P2
  - P3
  - P4
  - P5

judge_other_label: OTHER

frames:
  - F1
  - F2
  - F3

runs_per_condition: 1
experiment_temperature: 0.7
judge_temperature: 0
max_output_tokens: 160
concurrency: 4
max_budget_usd: 2.0
random_seed: 20260816
judge_a_rate_threshold: 0.5
