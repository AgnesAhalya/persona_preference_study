experimental_models:
  - google/gemini-2.5-flash-lite
  - qwen/qwen3-14b

experiment_id: five_personas_plus_assistant_v3

judge_models:
  - openai/gpt-4.1-mini
  - openai/gpt-5-nano

prompt_files:
  personas: prompts/personas.yaml
  experiment: prompts/experiment.yaml
  judges: prompts/judges.yaml

include_baseline: true
baseline:
  id: P0
  name: Assistant

personas:
  P1:
    name: Mathematician
  P2:
    name: Strategist
  P3:
    name: Contrarian
  P4:
    name: Slacker
  P5:
    name: Adversarial

judge_personas:
  - P1
  - P2
  - P3
  - P4
  - P5

judge_other_label: OTHER

frames:
  - F1
  - F2
  - F3

runs_per_condition: 3
experiment_temperature: 0.2
judge_temperature: 0
max_output_tokens: 160
concurrency: 4
max_budget_usd: 3.0
random_seed: 20260816
judge_a_rate_threshold: 0.5
