name: Run preference experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Experiment size
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - pilot
          - full
      run_judges:
        description: Run judges after the experiment
        required: true
        default: false
        type: boolean
      judge_a_rate_threshold:
        description: "Judge bucket: 0=all; 0.5=A majority; 1=A always"
        required: true
        default: "0.5"
        type: choice
        options:
          - "0"
          - "0.5"
          - "1"
      experiment_model_1:
        description: "Experiment model 1 (blank = config.yaml)"
        required: false
        type: string
      experiment_model_2:
        description: "Experiment model 2 (blank = config.yaml)"
        required: false
        type: string
      judge_model_1:
        description: "Judge model 1 (blank = config.yaml)"
        required: false
        type: string
      judge_model_2:
        description: "Judge model 2 (blank = config.yaml)"
        required: false
        type: string
      max_budget_usd:
        description: "Maximum OpenRouter spend in USD (blank = config.yaml)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      IMAGE_NAME: preference-experiment
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EXPERIMENT_MODEL_1: ${{ inputs.experiment_model_1 }}
      EXPERIMENT_MODEL_2: ${{ inputs.experiment_model_2 }}
      JUDGE_MODEL_1: ${{ inputs.judge_model_1 }}
      JUDGE_MODEL_2: ${{ inputs.judge_model_2 }}
      MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag "$IMAGE_NAME" .

      - name: Prepare results directory
        run: mkdir -p results

      - name: Run experiment
        shell: bash
        run: |
          case "${{ inputs.mode }}" in
            dry-run) mode_args=(--dry-run) ;;
            pilot) mode_args=(--pilot) ;;
            full) mode_args=() ;;
            *) echo "Unknown mode" >&2; exit 1 ;;
          esac

          docker run --rm \
            --env OPENROUTER_API_KEY \
            --env EXPERIMENT_MODEL_1 \
            --env EXPERIMENT_MODEL_2 \
            --env JUDGE_MODEL_1 \
            --env JUDGE_MODEL_2 \
            --env MAX_BUDGET_USD \
            --volume "$PWD/results:/app/results" \
            "$IMAGE_NAME" python run_experiment.py "${mode_args[@]}"

      - name: Run judges
        if: ${{ inputs.run_judges && inputs.mode != 'dry-run' }}
        run: |
          docker run --rm \
            --env OPENROUTER_API_KEY \
            --env EXPERIMENT_MODEL_1 \
            --env EXPERIMENT_MODEL_2 \
            --env JUDGE_MODEL_1 \
            --env JUDGE_MODEL_2 \
            --env MAX_BUDGET_USD \
            --volume "$PWD/results:/app/results" \
            "$IMAGE_NAME" python run_judges.py \
            --a-rate-threshold "${{ inputs.judge_a_rate_threshold }}"

      - name: Analyze available results
        if: ${{ always() && inputs.mode != 'dry-run' }}
        run: |
          docker run --rm \
            --env EXPERIMENT_MODEL_1 \
            --env EXPERIMENT_MODEL_2 \
            --env JUDGE_MODEL_1 \
            --env JUDGE_MODEL_2 \
            --env MAX_BUDGET_USD \
            --volume "$PWD/results:/app/results" \
            "$IMAGE_NAME" python analyze.py \
            --mode "${{ inputs.mode }}" \
            --a-rate-threshold "${{ inputs.judge_a_rate_threshold }}"

      - name: Upload results
        if: ${{ always() && inputs.mode != 'dry-run' }}
        uses: actions/upload-artifact@v4
        with:
          name: preference-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
